<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人讀書計劃管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) for Excel Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-size: 18px; } /* 整體字體放大 2pt */
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header 導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-4 sm:px-8">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wide text-center sm:text-left break-words">📖 個人讀書計劃管理</h1>
            <nav class="flex bg-indigo-700 p-1 rounded-xl shadow-inner w-full sm:w-auto justify-center">
                <button id="nav-plan" onclick="switchTab('plan')" class="flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-white bg-indigo-900 shadow transition">今日計劃</button>
                <button id="nav-data" onclick="switchTab('data')" class="flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-indigo-200 hover:text-white transition">資料來源與 Excel</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">

        <!-- 視圖 1：今日讀書計劃 -->
        <section id="view-plan" class="space-y-6">
            <!-- 日期與班別控制列 -->
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                    <button onclick="changeDate(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">◀ 前一日</button>
                    <input type="date" id="current-date-input" onchange="onDateInputChange(this.value)" class="px-3 py-2 border border-slate-300 rounded-xl font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button onclick="changeDate(1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">後一日 ▶</button>
                </div>
                <div id="shift-badge" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-bold rounded-xl border border-indigo-100 text-center w-full sm:w-auto">
                    載入中...
                </div>
            </div>

            <!-- 時段計劃清單 -->
            <div id="slots-container" class="space-y-4">
                <!-- 動態生成時段卡片 -->
            </div>
        </section>

        <!-- 視圖 2：資料來源與 Excel 匯入 -->
        <section id="view-data" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">📁 匯入 Excel 讀書計劃</h2>
                    <p class="text-slate-600 text-base">您可以上傳包含自訂時段內容或班別對應的 Excel 檔案 (.xlsx / .xls) 或 CSV 檔案。</p>
                </div>

                <!-- 檔案上傳區 -->
                <div class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-8 text-center bg-slate-50 transition cursor-pointer relative" onclick="document.getElementById('excel-file').click()">
                    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
                    <div class="space-y-2">
                        <span class="text-4xl">📊</span>
                        <p class="font-bold text-slate-700">點擊此處選擇 Excel 檔案或將檔案拖曳至此</p>
                        <p class="text-xs text-slate-500">支援 .xlsx, .xls, .csv 格式</p>
                    </div>
                </div>

                <!-- 範本下載與重置 -->
                <div class="flex flex-col sm:flex-row gap-4 pt-4 border-t border-slate-100">
                    <button onclick="downloadExcelTemplate()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow transition text-center">
                        📥 下載 Excel 範本格式
                    </button>
                    <button onclick="resetToDefaultData()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-6 rounded-xl shadow transition text-center">
                        🔄 恢復預設計劃資料
                    </button>
                </div>
            </div>

            <!-- 當前資料庫預覽 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="text-lg font-bold text-slate-900">📋 目前資料庫內容預覽</h3>
                <div id="data-preview" class="overflow-x-auto max-h-96 overflow-y-auto border border-slate-200 rounded-xl">
                    <!-- 表格預覽動態生成 -->
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        const TIME_SLOTS = [
            "09:00-11:00",
            "13:30-15:00",
            "15:00-17:30",
            "17:30-19:30",
            "19:30-21:00",
            "21:30-22:30"
        ];

        const WEEKDAYS = ["禮拜日", "禮拜一", "禮拜二", "禮拜三", "禮拜四", "禮拜五", "禮拜六"];
        const SHIFTS = ["A1", "A2", "A3", "D", "B1", "B2", "B3", "D", "C1", "C2", "C3", "D"];
        
        // 基準日設定：2026-10-24 禮拜六 A1
        const BASE_DATE = new Date("2026-10-24T00:00:00");
        const BASE_SHIFT_INDEX = 0; // "A1"

        let currentDate = new Date();
        let userDatabase = {};
        let userLogs = {};

        window.onload = function() {
            loadLocalStorage();
            if (isNaN(currentDate.getTime()) || currentDate < BASE_DATE) {
                currentDate = new Date(BASE_DATE);
            }
            updateDateInputUI();
            renderPlanner();
            renderDataPreview();
        };

        function switchTab(tabName) {
            const planSec = document.getElementById('view-plan');
            const dataSec = document.getElementById('view-data');
            const navPlan = document.getElementById('nav-plan');
            const navData = document.getElementById('nav-data');

            if (tabName === 'plan') {
                planSec.classList.remove('hidden');
                dataSec.classList.add('hidden');
                navPlan.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-white bg-indigo-900 shadow transition";
                navData.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-indigo-200 hover:text-white transition";
                renderPlanner();
            } else {
                planSec.classList.add('hidden');
                dataSec.classList.remove('hidden');
                navData.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-white bg-indigo-900 shadow transition";
                navPlan.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-medium text-indigo-200 hover:text-white transition";
                renderDataPreview();
            }
        }

        function getDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getShiftForDate(date) {
            const targetTime = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
            const baseTime = new Date(BASE_DATE.getFullYear(), BASE_DATE.getMonth(), BASE_DATE.getDate()).getTime();
            const diffDays = Math.round((targetTime - baseTime) / (1000 * 60 * 60 * 24));
            
            let shiftIndex = (BASE_SHIFT_INDEX + (diffDays % SHIFTS.length)) % SHIFTS.length;
            if (shiftIndex < 0) shiftIndex += SHIFTS.length;
            return SHIFTS[shiftIndex];
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            updateDateInputUI();
            renderPlanner();
        }

        function onDateInputChange(val) {
            if (!val) return;
            const parts = val.split('-');
            currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
            renderPlanner();
        }

        function updateDateInputUI() {
            const input = document.getElementById('current-date-input');
            input.value = getDateKey(currentDate);
        }

        function renderPlanner() {
            const shift = getShiftForDate(currentDate);
            const weekday = WEEKDAYS[currentDate.getDay()];
            const dateStr = `${currentDate.getFullYear()}/${currentDate.getMonth()+1}/${currentDate.getDate()}`;
            
            document.getElementById('shift-badge').innerHTML = `📅 ${dateStr} （${weekday}） ｜ 班別：<span class="text-indigo-600 font-extrabold text-lg">${shift}</span>`;

            const container = document.getElementById('slots-container');
            container.innerHTML = '';

            const dateKey = getDateKey(currentDate);
            if (!userLogs[dateKey]) userLogs[dateKey] = {};

            TIME_SLOTS.forEach((slotTime, idx) => {
                const defaultTask = (userDatabase[shift] && userDatabase[shift][idx]) !== undefined 
                    ? userDatabase[shift][idx] 
                    : `讀書計劃：${slotTime} 預設內容`;

                const isUnavailable = defaultTask.includes("不可利用");
                const log = userLogs[dateKey][idx] || { status: 'uncompleted', customText: '' };

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border transition shadow-sm ${isUnavailable ? 'bg-slate-100 border-slate-300 opacity-75' : 'bg-white border-slate-200'}`;

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-lg text-sm font-bold">${slotTime}</span>
                                ${isUnavailable ? '<span class="px-2 py-0.5 bg-slate-300 text-slate-700 rounded-md text-xs font-bold">不可利用</span>' : ''}
                            </div>
                            <p class="text-lg font-semibold text-slate-800 pt-1">${defaultTask}</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
                            <select onchange="updateLogStatus('${dateKey}', ${idx}, this.value)" class="px-3 py-2 border border-slate-300 rounded-xl font-medium text-base bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="uncompleted" ${log.status === 'uncompleted' ? 'selected' : ''}>⏳ 未完成</option>
                                <option value="completed" ${log.status === 'completed' ? 'selected' : ''}>✅ 已完成</option>
                                <option value="other" ${log.status === 'other' ? 'selected' : ''}>✏️ 其他</option>
                            </select>
                        </div>
                    </div>
                    <div id="custom-box-${dateKey}-${idx}" class="mt-3 pt-3 border-t border-slate-100 ${log.status === 'other' ? '' : 'hidden'}">
                        <input type="text" value="${log.customText || ''}" placeholder="請自由輸入內容..." oninput="updateLogCustomText('${dateKey}', ${idx}, this.value)" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateLogStatus(dateKey, idx, status) {
            if (!userLogs[dateKey]) userLogs[dateKey] = {};
            if (!userLogs[dateKey][idx]) userLogs[dateKey][idx] = { status: 'uncompleted', customText: '' };
            
            userLogs[dateKey][idx].status = status;

            const customBox = document.getElementById(`custom-box-${dateKey}-${idx}`);
            if (status === 'other') {
                customBox.classList.remove('hidden');
            } else {
                customBox.classList.add('hidden');
            }
            saveLocalStorage();
        }

        function updateLogCustomText(dateKey, idx, text) {
            if (!userLogs[dateKey]) userLogs[dateKey] = {};
            if (!userLogs[dateKey][idx]) userLogs[dateKey][idx] = { status: 'other', customText: '' };
            userLogs[dateKey][idx].customText = text;
            saveLocalStorage();
        }

        function initDefaultDatabase() {
            userDatabase = {};
            SHIFTS.forEach(shift => {
                userDatabase[shift] = [
                    `[${shift}] 國文/英文核心單字與閱讀`,
                    `[${shift}] 專業科目一重點複習`,
                    `[${shift}] 專業科目一考古題練習`,
                    `[${shift}] 專業科目二精讀與筆記`,
                    `[${shift}] 錯題檢討與觀念釐清`,
                    `[${shift}] 當日總結與明日預習`
                ];
            });
            userDatabase["A2"][2] = "不可利用";
            userDatabase["B1"][4] = "不可利用";
        }

        function saveLocalStorage() {
            localStorage.setItem('study_planner_db', JSON.stringify(userDatabase));
            localStorage.setItem('study_planner_logs', JSON.stringify(userLogs));
        }

        function loadLocalStorage() {
            const savedDb = localStorage.getItem('study_planner_db');
            const savedLogs = localStorage.getItem('study_planner_logs');

            if (savedDb) {
                try { userDatabase = JSON.parse(savedDb); } catch(e) { initDefaultDatabase(); }
            } else {
                initDefaultDatabase();
            }

            if (savedLogs) {
                try { userLogs = JSON.parse(savedLogs); } catch(e) { userLogs = {}; }
            }
        }

        function resetToDefaultData() {
            if (confirm("確定要恢復預設的讀書計劃資料嗎？自訂修改將被重置。")) {
                initDefaultDatabase();
                userLogs = {};
                saveLocalStorage();
                renderPlanner();
                renderDataPreview();
                alert("已成功恢復預設資料！");
            }
        }

        function renderDataPreview() {
            const preview = document.getElementById('data-preview');
            let html = `<table class="w-full text-left border-collapse bg-white text-sm sm:text-base">
                <thead>
                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                        <th class="p-3 font-bold">班別</th>
                        <th class="p-3 font-bold">09:00-11:00</th>
                        <th class="p-3 font-bold">13:30-15:00</th>
                        <th class="p-3 font-bold">15:00-17:30</th>
                        <th class="p-3 font-bold">17:30-19:30</th>
                        <th class="p-3 font-bold">19:30-21:00</th>
                        <th class="p-3 font-bold">21:30-22:30</th>
                    </tr>
                </thead>
                <tbody>`;

            SHIFTS.forEach((shift, sIdx) => {
                const tasks = userDatabase[shift] || Array(6).fill("");
                html += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-3 font-bold text-indigo-600 bg-slate-50">${shift}</td>`;
                tasks.forEach(t => {
                    html += `<td class="p-3 text-slate-700">${t}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            preview.innerHTML = html;
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let importedDb = {};
                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (row && row.length >= 7) {
                            const shift = String(row[0]).trim();
                            if (SHIFTS.includes(shift)) {
                                importedDb[shift] = [
                                    String(row[1] || ''),
                                    String(row[2] || ''),
                                    String(row[3] || ''),
                                    String(row[4] || ''),
                                    String(row[5] || ''),
                                    String(row[6] || '')
                                ];
                            }
                        }
                    }

                    if (Object.keys(importedDb).length > 0) {
                        SHIFTS.forEach(s => {
                            if (importedDb[s]) userDatabase[s] = importedDb[s];
                        });
                        saveLocalStorage();
                        renderDataPreview();
                        renderPlanner();
                        alert("🎉 Excel 檔案匯入成功！");
                    } else {
                        alert("⚠️ 匯入失敗：找不到對應的班別格式（A1, A2, A3, D, B1...），請參考範本格式。");
                    }
                } catch (err) {
                    console.error(err);
                    alert("❌ 讀取 Excel 發生錯誤，請確認檔案格式是否正確。");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadExcelTemplate() {
            let aoa = [
                ["班別", "09:00-11:00", "13:30-15:00", "15:00-17:30", "17:30-19:30", "19:30-21:00", "21:30-22:30"]
            ];
            SHIFTS.forEach(shift => {
                aoa.push([
                    shift,
                    `[${shift}] 國文/英文`,
                    `[${shift}] 專業科目一`,
                    `[${shift}] 專業科目一練習`,
                    `[${shift}] 專業科目二`,
                    `[${shift}] 錯題檢討`,
                    `[${shift}] 總結與休息`
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "讀書計劃範本");
            XLSX.writeFile(wb, "StudyPlanner_Template.xlsx");
        }
    </script>
</body>
</html>
